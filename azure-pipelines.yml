trigger:
  - main

variables:
  imageName: 'knowledgevault-api'
  acrName: 'knowledgevaultacr-dnfgacd6aab3d5a0'
  acrLoginServer: '$(acrName).azurecr.io'
  acrServiceConnection: 'knowledgevaultacr' 

stages:
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-22.04'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '9.0.x'

          - script: ls -R
            displayName: Show repo structure

          - script: dotnet restore
            displayName: Restore

          - script: dotnet build --no-restore
            displayName: Build

          - script: |
              dotnet test ./KnowledgeVault.Api.Tests/KnowledgeVault.Api.Tests.csproj --no-build -v diag --logger "trx;LogFileName=tests.trx" > test_output.log 2>&1 || true
            displayName: Run tests (diag, capture)

          - script: |
              tail -n 2000 test_output.log
            displayName: Show test log

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/tests.trx'
              failTaskOnFailedTests: true

  - stage: PublishAndDeploy
    displayName: Publish image and deploy
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: PublishImage
        pool:
          vmImage: 'ubuntu-22.04'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and push Docker image
            inputs:
              command: buildAndPush
              containerRegistry: $(acrServiceConnection)
              repository: $(imageName)
              Dockerfile: 'KnowledgeVault.Api/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(Build.BuildId)
                latest

      - deployment: DeployWeb
        displayName: Deploy Docker container to VM
        dependsOn: PublishImage
        environment:
          name: 'KnowledgeVault_Testing'
          resourceName: 'knowledgeVault-VM'
          resourceType: 'virtualMachine'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Docker@2
                  displayName: Login to ACR
                  inputs:
                    command: login
                    containerRegistry: $(acrServiceConnection)

                - script: |
                    set -e

                    # PostgreSQL connection details (from docker-compose)
                    DB_USER="postgres"
                    DB_PASSWORD="postgres"
                    DB_NAME="knowledgevault"
                    API_IMAGE="$(acrLoginServer)/$(imageName):$(Build.BuildId)"

                    echo "Starting PostgreSQL..."
                    docker stop knowledgevault-db || true
                    docker rm knowledgevault-db || true
                    docker run -d \
                      --name knowledgevault-db \
                      -e POSTGRES_USER=$DB_USER \
                      -e POSTGRES_PASSWORD=$DB_PASSWORD \
                      -e POSTGRES_DB=$DB_NAME \
                      -p 5432:5432 \
                      postgres:16

                    echo "Waiting for PostgreSQL to be ready..."
                    sleep 10

                    echo "Pulling and starting API..."
                    docker stop knowledgevault-api || true
                    docker rm knowledgevault-api || true
                    docker run -d \
                      --name knowledgevault-api \
                      -p 8080:8080 \
                      -e ASPNETCORE_URLS=http://+:8080 \
                      -e ASPNETCORE_ENVIRONMENT=Production \
                      -e ConnectionStrings__KnowledgeVault="Host=knowledgevault-db;Database=$DB_NAME;Username=$DB_USER;Password=$DB_PASSWORD" \
                      --link knowledgevault-db:knowledgevault-db \
                      $API_IMAGE

                    echo "Deployment complete"
                  displayName: Deploy PostgreSQL and API containers